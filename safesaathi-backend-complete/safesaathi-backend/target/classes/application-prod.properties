# ---------- PRODUCTION (cloud) settings ----------
# Ye profile tab chalta hai jab SPRING_PROFILES_ACTIVE=prod ho (Dockerfile mein already set hai).
# Neeche ki values BINA default ke hain: environment variable na ho to server start hi nahi hoga.
# Isse galti se kamzor/purana password ya JWT secret cloud par nahi chalega.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Admin dashboard ki chaabi (environment variable ADMIN_KEY se). Khali ho to admin band rehta hai.
admin.key=${ADMIN_KEY:}
