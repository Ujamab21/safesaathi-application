spring.application.name=safesaathi-backend

# Cloud par PORT environment variable milta hai, laptop par 8080 chalta hai
server.port=${PORT:8080}

# HTTPS proxy (cloud) ke peeche sahi se kaam kare
server.forward-headers-strategy=framework

# ---------- LOCAL (laptop) settings ----------
# Har value environment variable se badli ja sakti hai. Variable na ho to ye local default use hota hai.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/safesaathi?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:safeuser}
spring.datasource.password=${DB_PASSWORD:YourPassword123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
jwt.secret=${JWT_SECRET:SafeSaathiSuperSecretKeyForJwtSigning2026ChangeThis123}
jwt.expiration-ms=86400000

# Admin dashboard ki chaabi (environment variable ADMIN_KEY se). Khali ho to admin band rehta hai.
admin.key=${ADMIN_KEY:}
