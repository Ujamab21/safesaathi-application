# HTTPS wala setup (domain chahiye, jaise safesaathi.duckdns.org).
# Chalane ka tarika:  docker compose up -d --build
# Pehle .env file banao (.env.example dekho).

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: safesaathi
      POSTGRES_USER: safeuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeuser -d safesaathi"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/safesaathi
      DB_USER: safeuser
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xmx300m -XX:+UseSerialGC"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
