# SIMPLE setup: domain ke bina, seedha http://<server-IP>/ par chalta hai (HTTPS nahi).
# Dhyan: HTTP mein password internet par bina encryption ke jata hai. Sirf testing/demo ke liye.
# Chalane ka tarika:  docker compose -f docker-compose.simple.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: safesaathi
      POSTGRES_USER: safeuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safeuser -d safesaathi"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/safesaathi
      DB_USER: safeuser
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-Xmx300m -XX:+UseSerialGC"
    ports:
      - "80:8080"

volumes:
  dbdata:
